# gotrace v0.6.0's .golangci.yml under the v2 schema. golangci-lint v2.13.2
# rejects upstream's file as is (run.skip-dirs-use-default is not in the v2
# schema), so it was run through `golangci-lint migrate --skip-validation`,
# which dropped that key and re-added the default directory exclusions
# (third_party$, builtin$, examples$) upstream had switched off; they are
# removed again here. The reusable workflow prefers this file to the
# headlesslab default because the imported code is kept verbatim; tightening
# the rules is a change of its own.
version: "2"
linters:
  enable:
    - gocyclo
    - misspell
    - revive
  settings:
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
